<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TruthLens organization invitation</title>
   </head>

   <body style="margin: 0; padding: 32px 16px; background: #f5f7fa; font-family: Arial, sans-serif; color: #1f2937">
      <div
         style="
            max-width: 560px;
            margin: 0 auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
         "
      >
         <h1 style="margin: 0 0 16px; font-size: 22px">Join {{ organization_name }}</h1>

         <p>
            {{ inviter_name }} invited you to join
            <strong>{{ organization_name }}</strong>
            as <strong>{{ role_label }}</strong>
            on TruthLens.
         </p>

         <p style="margin: 24px 0">
            <a
               href="{{ invitation_url }}"
               style="
                  display: inline-block;
                  padding: 12px 18px;
                  border-radius: 8px;
                  background: #111827;
                  color: #ffffff;
                  text-decoration: none;
                  font-weight: 600;
               "
            >
               Review invitation
            </a>
         </p>

         <p style="color: #6b7280; font-size: 13px; line-height: 1.6">This invitation expires on {{ expires_at }}.</p>

         <p style="margin-bottom: 0; color: #6b7280; font-size: 13px; line-height: 1.6">
            If you were not expecting this invitation, you can safely ignore this email.
         </p>
      </div>
   </body>
</html>
